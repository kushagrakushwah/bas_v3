
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-secureforge}
    # C4/C5 fix: do NOT expose database port to host network
    # postgres is only accessible from within the Docker network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secureforge} -d ${POSTGRES_DB:-secureforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    # C5 fix: do NOT expose Elasticsearch to host — internal only
    expose:
      - "9200"
    deploy:
      resources:
        limits:
          memory: 1g

  bas-engine:
    build: 
      context: ./bas_engine
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-secureforge}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # C4 fix: API_KEY must be set in .env — no default value
      - API_KEY=${API_KEY:?API_KEY is required in env}
      # Lab VM allowlist — private IPs listed here bypass the SSRF block
      - LAB_TARGETS=${LAB_TARGETS:-}

    # M10 fix: removed source volume mount — use image-baked code in production
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1g

  dashboard:
    build:
      context: ./secureforge-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - INTERNAL_API_URL=http://bas-engine:8000
      # C4 fix: API_KEY must be set in .env
      - API_KEY=${API_KEY:?API_KEY is required}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # L9 fix: NEXTAUTH_URL must be set per deployment environment
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3001}
      # C4 fix: NEXTAUTH_SECRET must be set in .env — no default value
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required in env}
    depends_on:
      - bas-engine
    deploy:
      resources:
        limits:
          memory: 512m