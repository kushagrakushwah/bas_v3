
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: secureforge
      POSTGRES_PASSWORD: secureforge
      POSTGRES_DB: secureforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureforge -d secureforge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  bas-engine:
    build: 
      context: ./bas_engine
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=dev
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://secureforge:secureforge@postgres:5432/secureforge
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - API_KEY=secureforge-dev-api-key-change-in-production
    volumes:
      - ./bas_engine:/app/bas_engine
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  dashboard:
    build:
      context: ./secureforge-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_API_KEY=secureforge-dev-api-key-change-in-production
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=secureforge-super-secret-key-12345
    depends_on:
      - bas-engine