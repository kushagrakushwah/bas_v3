
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secureforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secureforge}
      POSTGRES_DB: ${POSTGRES_DB:-secureforge}
    # C4/C5 fix: do NOT expose database port to host network
    # postgres is only accessible from within the Docker network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secureforge} -d ${POSTGRES_DB:-secureforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    # C5 fix: do NOT expose Elasticsearch to host — internal only
    expose:
      - "9200"
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  bas-engine:
    build: 
      context: ./bas_engine
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-secureforge}:${POSTGRES_PASSWORD:-secureforge}@postgres:5432/${POSTGRES_DB:-secureforge}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # API_KEY must be configured in .env
      - API_KEY=${API_KEY}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # Lab VM allowlist — private IPs listed here bypass the SSRF block
      - LAB_TARGETS=${LAB_TARGETS:-}
      # Admin and Operator credentials for the dashboard (must be configured in .env)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - OPERATOR_PASSWORD=${OPERATOR_PASSWORD}
      # SMTP Alerting Credentials
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    # M10 fix: removed source volume mount — use image-baked code in production
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g

  celery-worker:
    build: 
      context: ./bas_engine
    command: celery -A bas_engine.worker.celery_app worker --loglevel=info
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-secureforge}:${POSTGRES_PASSWORD:-secureforge}@postgres:5432/${POSTGRES_DB:-secureforge}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - API_KEY=${API_KEY}
      - LAB_TARGETS=${LAB_TARGETS:-}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g

  dashboard:
    build:
      context: ./secureforge-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - INTERNAL_API_URL=http://bas-engine:8000
      # API_KEY must match the bas-engine configuration
      - API_KEY=${API_KEY}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # L9 fix: NEXTAUTH_URL must be set per deployment environment
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3001}
      # C4 fix: NEXTAUTH_SECRET must be set in .env — no default value
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      - bas-engine
    deploy:
      resources:
        limits:
          memory: 512m