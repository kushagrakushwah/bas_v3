apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureforge-dashboard
  namespace: secureforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secureforge-dashboard
  template:
    metadata:
      labels:
        app: secureforge-dashboard
    spec:
      containers:
      - name: dashboard
        image: secureforge-frontend:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://bas-engine:8000/api/v1"
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch:9200"
        ports:
        - containerPort: 3000
