apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bas-engine-network-policy
  namespace: secureforge
spec:
  podSelector:
    matchLabels:
      app: bas-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dashboard
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: logstash
      ports:
        - protocol: TCP
          port: 5044
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch
      ports:
        - protocol: TCP
          port: 9200
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound internet traffic (for simulation targets)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
